<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FileButler</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/chat.css">
  <link rel="stylesheet" href="/static/confirmation.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">F</span><div><strong>FileButler</strong><small id="health">正在连接本地服务…</small></div></div>
    <div class="topbar-actions"><button id="toggle-sidebar" class="icon-button sidebar-toggle" type="button" aria-controls="sidebar">对话</button><button id="open-tasks" class="icon-button" type="button">任务与复核</button><button id="toggle-files" class="icon-button" type="button" title="收起或展开文件区">文件区</button><button id="toggle-dev" class="icon-button dev-toggle" type="button" aria-pressed="false" title="显示费用、耗时、原始执行记录和内部核验细节">开发者模式</button></div>
  </header>
  <main class="layout">
    <aside id="sidebar" class="sidebar">
      <button id="new-chat" class="new-chat" type="button">＋ <span>新建对话</span></button>
      <div class="section-label">最近对话</div>
      <nav id="conversation-list" class="conversation-list" aria-label="最近对话"><div class="conversation-empty">正在读取…</div></nav>
    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>
    <div id="resize-sidebar" class="resize-handle" role="separator" aria-orientation="vertical" aria-label="拖动调整对话列表宽度，双击恢复默认" tabindex="0"></div>
    <div id="resize-files" class="resize-handle" role="separator" aria-orientation="vertical" aria-label="拖动调整文件区宽度，双击恢复默认" tabindex="0"></div>
    <section class="chat-panel">
      <div class="chat-heading"><div><h1 id="conversation-title">新对话</h1><p id="chat-subtitle">FileButler 在本机沙盒中帮你查找和整理文件</p></div><span id="run-status" class="status" role="status" aria-live="polite"></span></div>
      <div id="messages" class="messages" role="region" aria-label="对话记录" tabindex="0"><div class="welcome"><div class="welcome-icon">✦</div><h2>你想整理什么？</h2><p>可以用自然语言查找、阅读、分类或整理沙盒里的文件。</p><div class="suggestions"><button>帮我找出有关强化学习的论文</button><button>列出文献目录里的 PDF</button><button>查看当前文件夹里有哪些文件</button></div></div></div>
      <div id="confirmation" class="confirmation hidden" role="region" aria-label="待确认的文件操作"></div>
      <form id="composer" class="composer"><textarea id="message-input" rows="1" maxlength="8000" placeholder="给 FileButler 发送消息…" required></textarea><div class="composer-footer"><span>Enter 发送 · Shift+Enter 换行</span><button id="send-button" type="submit">发送 <span>↗</span></button></div></form>
      <div class="privacy-note">本地网页 · 仅访问配置的沙盒 · 模型请求使用当前 API 配置</div>
    </section>
    <aside id="file-panel" class="file-panel">
      <div class="file-heading"><div><h2>沙盒文件</h2><p id="sandbox-label">加载中…</p></div><button id="refresh-files" class="icon-button" title="刷新">↻</button></div>
      <div class="breadcrumbs"><button id="file-up" class="up-button" disabled>↑ 上级</button><span id="current-path">.</span></div>
      <div id="file-list" class="file-list" role="region" aria-label="沙盒文件列表" tabindex="0"></div>
      <div id="resize-filelist" class="resize-row" role="separator" aria-orientation="horizontal" aria-label="拖动调整文件列表与预览的高度，双击恢复默认" tabindex="0"></div>
      <div class="preview-heading"><span>预览</span><span id="preview-type"></span></div>
      <div id="preview" class="preview" role="region" aria-label="文件预览" tabindex="0"><div class="empty-preview">选择文件查看内容</div></div>
    </aside>
  </main>
  <dialog id="confirmation-review" class="review-dialog" aria-labelledby="review-title">
    <header class="review-header"><div><span class="review-eyebrow">操作核对</span><h2 id="review-title">确认文件操作</h2></div><button id="review-close" class="icon-button" type="button" aria-label="关闭核对窗口">✕</button></header>
    <div class="review-layout"><aside id="review-plan" class="review-plan" aria-label="操作清单"></aside><section id="review-preview" class="review-preview" aria-label="待确认文件预览"></section></div>
    <footer id="review-footer" class="review-footer"></footer>
  </dialog>
  <dialog id="task-editor" class="task-dialog" aria-labelledby="task-editor-title">
    <header class="review-header"><h2 id="task-editor-title">任务与复核</h2><button id="task-editor-close" class="icon-button" type="button" aria-label="关闭任务窗口">✕</button></header>
    <div id="task-editor-body" class="task-editor-body"></div>
  </dialog>
  <dialog id="delete-dialog" class="delete-dialog" aria-labelledby="delete-dialog-title">
    <h2 id="delete-dialog-title">删除这段对话？</h2>
    <p class="delete-target">「<strong id="delete-conversation-title"></strong>」</p>
    <p class="delete-note">只删除网页里的消息和运行记录，无法恢复。不会改动沙盒文件、回收区和操作日志；此对话中的“撤销”按钮会随之消失，已记录的文件操作仍可在终端撤销。</p>
    <p id="delete-feedback" class="delete-feedback" role="status"></p>
    <div class="delete-actions"><button id="delete-cancel" class="secondary-button" type="button">取消</button><button id="delete-confirm" class="danger-button" type="button">删除对话</button></div>
  </dialog>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"><span class="toast-text"></span><button id="toast-close" type="button" aria-label="关闭提示">✕</button></div>
  <script src="/static/app.js" defer></script>
  <script src="/static/tasks.js" defer></script>
</body>
</html>
