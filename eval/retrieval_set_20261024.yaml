# 检索评测集（2026-10-24，功能方案阶段 3），写检索代码之前冻结；冻结后题目、相关文件和证据都不改。
# 检索层诊断，不是模型端到端评测，也不是独立盲测：题目和标注由同一人写成，标注时看过全文。
#
# 两个语料：
# - papers：data/real/papers 的 51 篇真实论文，评测时复制到临时目录再检索（不往 data/real 写缓存）。
#   沿用 E12 的 Q01–Q12（retrieval_queries.yaml，原样不动），新增 Q13–Q30（主题查找）、F01–F19（细节查找）。
# - mixed：eval/retrieval_mixed.py 生成的混合格式资料库（Word、PPT、Excel、网页、Markdown、
#   扫描 PDF、照片、长 PDF），题目 M01–M12。
#
# 相关性：
# - 主题查找（Q）：按前两页的研究目标/提出的方法判相关，只在相关工作里提到不算；同一研究的不同版本都算。
# - 细节查找（F、M）：找写有该细节的文件；相关文件是全文逐篇查过的全部出处。
# 证据：每个相关文件给出页（PDF 的页、幻灯片序号、工作表序号，其他格式为 1）和该页上的原文片段，
# 评测前按全文核对，对不上即报错。
# 指标：Recall@k = 命中的相关文件数 / min(k, 相关文件数)；MRR@k；无相关题不计入 Recall，单列误候选。
base: retrieval_queries.yaml
corpora:
  papers: data/real/papers
  mixed: eval/retrieval_mixed.py
queries:
