# 真实数据任务集（主评测）。数据在 data/real/<名字>/，标准答案在 data/real/<名字>.labels.yaml，都不进 git。
# 断言写法见 eval/checker.py 顶部；placed / retitled 是为真实数据加的宽松断言。
# 标准答案由 eval/label_real.py 预填客观字段、人工审核主观字段；绝不让被测模型来标。

# ---------- 不依赖主观标注 ----------
- id: R01
  category: A
  scenario: real:papers
  seed: 0
  instruction: 这里一共有多少篇 PDF 论文（包括所有子文件夹）？只回答数字，不要改动任何文件
  expect:
    - answer_contains: "51"
    - no_change: true

- id: R02
  category: D
  scenario: real:papers
  seed: 0
  instruction: 有些论文是内容完全相同的重复文件（文件名可能不同，也可能在不同文件夹里），每组只保留一份，其余的删掉
  expect:
    - dedup: {}
    - others_unchanged: true

- id: R03
  category: C
  scenario: real:papers
  seed: 0
  instruction: 把中文论文都移到「中文文献」文件夹
  expect:
    - moved: {where: {lang: zh}, to: 中文文献}
    - others_unchanged: true

- id: R05
  category: C
  scenario: real:papers
  seed: 0
  instruction: 根目录下有些论文的文件名看不出内容（比如 Dong.pdf、out.pdf、1708.07104v1.pdf 这种），把它们重命名为论文的英文标题
  expect:
    # title_key 来自第一页文字或 PDF 元数据，已逐个对照第一页正文核对（标注里 review 仍保留 title，待你最终确认）
    - retitled:
        names: [1708.07104v1.pdf, 1912.12520v2.pdf, 2202.08159v1.pdf, Dong.pdf, Guacho.pdf, Hu.pdf, Wang.pdf, out.pdf]
        field: title_key
    - others_unchanged: {except: [2023.ccl-1.2.pdf]}   # 中文论文，文件名也看不出内容；改成英文标题或不改都合理

# ---------- 按主题分类（topic_ok 由 Claude 标注，见 papers.labels.yaml 顶部的分类含义）----------
- id: R04
  category: C
  scenario: real:papers
  seed: 0
  instruction: 根目录下还有一些没归类的论文，把它们分别放进已有的子文件夹（covid-19、review、transformer、强化学习、Anno）里，Anno 只放作者是 Sumiko Anno 的论文，哪一类都不合适的留在原处
  expect:
    - placed: {glob: "*.pdf", field: topic_ok}     # 只看根目录的论文；topic_ok 含 "." 表示留在原处也算对
    - others_unchanged: true

- id: R06
  category: B
  scenario: real:papers/flat                        # 51 篇全部打散在根目录
  seed: 0
  instruction: 把这些论文按主题整理到「covid-19」「review」「transformer」「强化学习」「Anno」五个文件夹里（Anno 放作者是 Sumiko Anno 的论文），哪一类都不合适的留在根目录
  expect:
    - placed: {glob: "*.pdf", field: topic_ok}
