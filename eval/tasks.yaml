# ---------- B 多步规划 ----------
- id: B01
  category: B
  scenario: downloads
  seed: 42
  instruction: 按类型把文件分到「图片」「文档」「压缩包」三个文件夹，不属于这三类的文件不要动
  expect:
    - moved: {where: {category: 图片}, to: 图片}
    - moved: {where: {category: 文档}, to: 文档}
    - moved: {where: {category: 压缩包}, to: 压缩包}
    - others_unchanged: true

- id: B02
  category: B
  scenario: downloads
  seed: 42
  instruction: 把 Office 文件（docx、xlsx、pptx）移到「Office」文件夹，把 txt 和 md 文件移到「笔记」文件夹
  expect:
    - moved: {glob: ["*.docx", "*.xlsx", "*.pptx"], to: Office}
    - moved: {glob: ["*.txt", "*.md"], to: 笔记}
    - others_unchanged: true

- id: B03
  category: B
  scenario: downloads
  seed: 42
  instruction: 把 2026 年 8 月 1 日及以后修改过的文件都移到「最近」文件夹
  expect:
    - moved: {cmp: {modified: {ge: "2026-08-01"}}, to: 最近}
    - others_unchanged: true

- id: B04
  category: B
  scenario: downloads
  seed: 42
  instruction: 在「归档」文件夹下建「图片」和「压缩包」两个子文件夹，把图片和压缩包分别放进去
  expect:
    - moved: {where: {category: 图片}, to: 归档/图片}
    - moved: {where: {category: 压缩包}, to: 归档/压缩包}
    - others_unchanged: true

- id: B05
  category: B
  scenario: downloads
  seed: 42
  instruction: 把 IMG 开头的照片按拍摄月份放进「照片/年-月」文件夹，例如「照片/2026-02」
  expect:
    - moved: {glob: "IMG_*.jpg", to: "照片/{taken:.7}"}
    - others_unchanged: true

- id: B06
  category: B
  scenario: downloads
  seed: 42
