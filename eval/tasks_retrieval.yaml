# 只在显式选择 --tasks retrieval / all 时运行，不混入现有 6 个真实任务基线。
- id: T01
  category: C
  scenario: real:papers
  seed: 0
  instruction: 找出以台湾登革热时空暴发预测及气候因素为研究主题的论文，移到「登革热待读」。其他论文不要动；不同文件版本分别保留，不要去重。
  expect:
    - moved:
        names:
          - Anno/Challenges and implications of predicting the spatiotemporal distribution of dengue fever outbreak in Chinese Taiwan using remote sensing data and dee.pdf
          - Anno/Spatiotemporal dengue fever hotspots associated with climatic factors in Taiwan including outbreak predictions based on machine-learning.pdf
        to: 登革热待读
    - count: {glob: "登革热待读/*.pdf", n: 2}
    - others_unchanged: true
